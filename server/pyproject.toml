[project]
name = "bench-server"
version = "0.1.0"
description = "ALTA server: FastAPI hub, pod bridge, Claude agent, Cartesia voice"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cartesia>=4.2.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyserial>=3.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
